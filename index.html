<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div class="card add-student">
        <h2>Add a student</h2>

        <form id="studentForm">
          <div class="input-group">
            <label for="studentName">Full name</label>
            <input
              type="text"
              id="studentName"
              name="name"
              placeholder="Enter full name"
            />
          </div>

          <div class="input-group">
            <label for="studentEmail">Email</label>
            <input
              type="email"
              id="studentEmail"
              name="email"
              placeholder="e.g. xxxxxx@gmail.com"
            />
          </div>

          <div class="input-group">
            <label for="studentMajor">Major</label>
            <input
              type="text"
              id="studentMajor"
              name="major"
              placeholder="e.g. Computer Science"
            />
          </div>

          <div class="input-group">
            <label for="studentGPA">GPA</label>
            <input
              type="number"
              step="0.01"
              id="studentGPA"
              name="gpa"
              placeholder="e.g. 3.65"
            />
          </div>

          <button type="submit" class="add-btn">Add Student</button>
        </form>
      </div>

      <div class="card roster">
        <div class="top-bar">
          <h2>Roster</h2>

          <div class="controls">
            <input
              type="text"
              id="searchInput"
              placeholder="Search by name or email"
            />

            <select id="majorFilter">
              <option value="">All majors</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Information Technology">
                Information Technology
              </option>
              <option value="Engineering">Engineering</option>
            </select>

            <button class="sort-btn" id="sortGPA">Sort by GPA ↑</button>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>NAME</th>
              <th>EMAIL</th>
              <th>MAJOR</th>
              <th>GPA</th>
              <th>ACTIONS</th>
            </tr>
          </thead>

          <tbody id="studentsTableBody"></tbody>
        </table>
      </div>
    </div>
  </body>
</html>
